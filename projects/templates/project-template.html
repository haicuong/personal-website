<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="stylesheet" href="/src/styles/main.css" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>{{TITLE}} | Hai Cuong</title>
    <meta name="description" content="{{DESCRIPTION}}" />
    <script type="module" src="/src/scripts/main.ts"></script>
  </head>
  <body>
    <site-header></site-header>
    <main>
      <article
        class="prose-p:my-6 prose-h1:text-3xl prose-code:wrap-anywhere prose-img:my-2 prose-h1:text-center prose-h1:mb-8 prose-h1:mt-8 prose dark:prose-invert w-full max-w-none mx-auto"
      >
        <img
          class="aspect-video mx-auto md:aspect-16/4 object-cover rounded-3xl"
          src="{{COVER_IMAGE_URL}}"
          alt="Cover Image"
        />
        <hr />
        <h1>{{TITLE}}</h1>
        <p>Created: {{CREATED_DATE}}</p>
        <div class="flex items-center flex-wrap gap-2">
          Tags: {{TECHSTACKS}}
        </div>
        <p>{{DESCRIPTION}}</p>
        <p>
          🔴 Live demo: {{LIVE_URL}}<br />
          💻 Source code: {{REPO_URL}}
        </p>
        {{CONTENT}}
      </article>
      <div class="giscus mt-8"></div>
      <script
        src="https://giscus.app/client.js"
        data-repo="haicuong/personal-website"
        data-repo-id="R_kgDOUJUoUQ"
        data-category="Comments"
        data-category-id="DIC_kwDOUJUoUc4DFUH2"
        data-mapping="pathname"
        data-strict="0"
        data-reactions-enabled="1"
        data-emit-metadata="0"
        data-input-position="top"
        data-theme="preferred_color_scheme"
        data-lang="en"
        data-loading="lazy"
        crossorigin="anonymous"
        async
      ></script>
      </div>
    </main>
    <site-footer></site-footer>
  </body>
</html>
